<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('skelora_theme_v1');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Exercise | Skelora Institute Logistics Simulator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A4A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="skelora-institute-dashboard.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
    Document Library
  </a>
  <div class="tb-title">
    <span class="t1" id="tbTitle1">Loading…</span>
    <span class="t2" id="tbTitle2"></span>
  </div>
  <div class="tb-spacer"></div>
  <button class="tb-pill" id="splitScreenToggleBtn" type="button" style="cursor:pointer;border:1px solid var(--border);background:var(--surface);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    <span id="splitScreenBtnLabel">Reference: Off</span>
  </button>
  <button class="tb-pill" id="wsThemeToggleBtn" type="button" aria-label="Toggle dark mode" style="cursor:pointer;border:1px solid var(--border);background:var(--surface);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="wsThemeIconSun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="wsThemeIconMoon" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
  </button>
  <div class="tb-pill" id="progressPill">Step 1</div>
  <div class="tb-pill timer" id="timerPill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 16,14"/></svg>
    <span id="timerDisplay">00:00</span>
  </div>
</header>

<div class="banner">
  <div class="banner-left">
    <div class="banner-eyebrow" id="bannerEyebrow"></div>
    <h1 id="bannerTitle"></h1>
    <p id="bannerDesc"></p>
    <div class="banner-phase-overview" id="bannerPhaseOverview"></div>
  </div>
  <ul class="banner-objectives" id="bannerObjectives"></ul>
</div>

<div class="wrap">
  <nav class="tracker" id="tracker"></nav>
  <section class="content">
    <div class="step-head">
      <div class="step-eyebrow" id="stepEyebrow">Step 1</div>
      <h2 id="stepTitle">Loading…</h2>
      <div class="sub" id="stepSub"></div>
    </div>
    <div class="step-body" id="stepBody"></div>
    <div class="step-footer">
      <button class="nav-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
        Back
      </button>
      <button class="nav-btn primary" id="nextBtn">
        Save &amp; Continue
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,6 15,12 9,18"/></svg>
      </button>
    </div>
  </section>
</div>

<div class="toast" id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:13px;padding:11px 18px;border-radius:9px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .22s ease;z-index:120;"></div>

<script src="auth.js"></script>
<script src="documents-data.js"></script>
<script src="job-engine.js"></script>
<script src="workflow-rules.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="engine.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
/* Phase 8: split-screen reference mode toggle - persists preference, re-renders the current step immediately */
(function(){
  function applyLabel(){
    const on = localStorage.getItem('skelora_split_v1') === 'on';
    const label = document.getElementById('splitScreenBtnLabel');
    if(label) label.textContent = 'Reference: ' + (on ? 'On' : 'Off');
  }
  applyLabel();
  const splitBtn = document.getElementById('splitScreenToggleBtn');
  if(splitBtn) splitBtn.addEventListener('click', ()=>{
    const on = localStorage.getItem('skelora_split_v1') === 'on';
    localStorage.setItem('skelora_split_v1', on ? 'off' : 'on');
    applyLabel();
    if(typeof renderStep === 'function' && typeof currentStep !== 'undefined') renderStep(currentStep);
  });
})();
/* Phase 8: dark mode toggle - shares the same key as the dashboard, so the choice follows the student everywhere */
(function(){
  function applyIcons(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const sun = document.getElementById('wsThemeIconSun');
    const moon = document.getElementById('wsThemeIconMoon');
    if(sun && moon){ sun.style.display = isDark ? 'none' : ''; moon.style.display = isDark ? '' : 'none'; }
  }
  applyIcons();
  const btn = document.getElementById('wsThemeToggleBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('skelora_theme_v1','light'); }
    else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('skelora_theme_v1','dark'); }
    applyIcons();
  });
})();
</script>
</body>
</html>
