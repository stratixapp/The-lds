<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skelora Institute Logistics Simulator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B2A4A">
<style>
  html,body{height:100%;margin:0;background:#0B1220;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .loader{display:flex;flex-direction:column;align-items:center;gap:14px;color:#B9C4D6;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:#4C8DFF;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  noscript{color:#B9C4D6;text-align:center;padding:24px;}
</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div>Loading Skelora Institute Logistics Simulator…</div>
  </div>
  <noscript>
    This app requires JavaScript. Please enable it, or open
    <a href="intro.html" style="color:#4C8DFF;">intro.html</a> directly.
  </noscript>

  <script src="auth.js"></script>
  <script>
    // Entry point for the whole app (GitHub Pages / any static host looks for
    // this file at the root, and it's what a bare folder double-click opens too).
    // Uses replace() everywhere below so this redirect never becomes an extra
    // back-button stop — pressing back from the dashboard or login screen goes
    // straight to wherever the user actually came from, not bounces through here.
    (function(){
      try{
        var user = (typeof skGetCurrentUser === "function") ? skGetCurrentUser() : null;
        window.location.replace(user ? "skelora-institute-dashboard.html" : "intro.html");
      } catch(e){
        // If anything above ever throws (e.g. corrupted localStorage), fail safe to the intro page.
        window.location.replace("intro.html");
      }
    })();
  </script>
</body>
</html>
